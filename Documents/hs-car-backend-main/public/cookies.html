<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H&S Car | Cookie Policy</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #d4af37; 
            --bg-dark: #0a0a0a; 
            --sidebar-bg: #121212; 
            --card-bg: #161616;
            --text-color: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-color); 
            display: flex; 
            min-height: 100vh; 
        }
        
        /* SIDEBAR STYLES */
        .sidebar { 
            width: 280px; 
            background: var(--sidebar-bg); 
            border-right: 1px solid #222; 
            padding-top: 50px; 
            flex-shrink: 0;
        }

        .nav-item { 
            display: block; 
            padding: 20px 30px; 
            color: #888; 
            text-decoration: none; 
            border-bottom: 1px solid #1a1a1a; 
            transition: 0.3s ease; 
        }

        .nav-item:hover, .nav-item.active { 
            border-left: 4px solid var(--gold); 
            color: var(--gold); 
            background: #1a1a1a; 
        }
        
        /* MAIN CONTENT AREA */
        .content { 
            flex: 1; 
            padding: 60px 80px; 
            position: relative;
            max-width: 1000px;
        }

        /* LANGUAGE SELECTOR IN HEADER */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .lang-select {
            background: var(--sidebar-bg);
            color: var(--gold);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
        }

        .lang-select option {
            background: var(--sidebar-bg);
            color: #fff;
        }

        h1 { 
            font-family: 'Playfair Display', serif; 
            color: var(--gold); 
            margin-bottom: 30px; 
            font-size: 2.2rem;
        }

        .back-btn { 
            display: inline-block; 
            color: var(--gold); 
            text-decoration: none; 
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .back-btn:hover {
            color: #fff;
        }

        /* LEGAL CONTENT STYLING */
        .legal-section {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #222;
            line-height: 1.7;
        }

        .legal-section h2 {
            color: var(--gold);
            font-size: 1.15rem;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        .legal-section h2:first-of-type {
            margin-top: 0;
        }

        .legal-section p {
            color: #bbb;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .cookie-badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 8px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        hr {
            border: 0;
            height: 1px;
            background: #2a2a2a;
            margin: 25px 0;
        }

</head>

        // 2. DİL DEĞİŞTİRME FONKSİYONU
        function setLanguage(lang) {
            if (!translations[lang]) lang = 'de'; 

            document.documentElement.lang = lang;

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });

            document.getElementById('legalContent').innerHTML = translations[lang].html;

            localStorage.setItem('preferredLang', lang);
            document.getElementById('languageSelect').value = lang;
        }

        // 3. SAYFA İLİŞKİLENDİRME VE YÜKLEME
        document.addEventListener('DOMContentLoaded', () => {
            const currentFile = window.location.pathname.split("/").pop();
            document.querySelectorAll('.nav-item').forEach(link => {
                if (link.getAttribute('href') === currentFile) link.classList.add('active');
            });

            const savedLang = localStorage.getItem('preferredLang') || 'de';
            setLanguage(savedLang);

            document.getElementById('languageSelect').addEventListener('change', (e) => {
                setLanguage(e.target.value);
            });
        });
    </script>
