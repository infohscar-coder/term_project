            border-radius: 6px;
            font-family: 'Inter', sans-serif;

        // 2. DİL DEĞİŞTİRME FONKSİYONU
        function setLanguage(lang) {
            if (!translations[lang]) lang = 'de'; // Varsayılan Almanca

            // Sayfa dil özniteliğini güncelle
            document.documentElement.lang = lang;

            // Navigasyon ve Başlıkları Güncelle
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });

            // HTML İçeriğini Güncelle
            document.getElementById('legalContent').innerHTML = translations[lang].html;

            // Tercihi Hafızaya Kaydet (LocalStorage)
            localStorage.setItem('preferredLang', lang);
            document.getElementById('languageSelect').value = lang;
        }

        // 3. SAYFA YÜKLENDİĞİNDE ÇALIŞACAK KODLAR
        document.addEventListener('DOMContentLoaded', () => {
            // Sidebar Active State
            const currentFile = window.location.pathname.split("/").pop();
            document.querySelectorAll('.nav-item').forEach(link => {
                if (link.getAttribute('href') === currentFile) link.classList.add('active');
            });

            // Kayıtlı Dili Yükle veya Varsayılan Olarak Almanca (de) Yap
            const savedLang = localStorage.getItem('preferredLang') || 'de';
            setLanguage(savedLang);

            // Select Değiştiğinde Dili Güncelle
            document.getElementById('languageSelect').addEventListener('change', (e) => {
                setLanguage(e.target.value);
            });
        });
