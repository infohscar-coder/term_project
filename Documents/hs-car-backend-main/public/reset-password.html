<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passwort zurücksetzen – H&amp;S Car</title>
  <style>
    :root { color-scheme: dark; --background: #18181b; --card: #27272a; --muted: #a1a1aa; --primary: #ffcc00; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: var(--background); color: #fff; font-family: Arial, sans-serif; }
    .card { width: min(100%, 440px); padding: 32px; border: 1px solid #3f3f46; border-radius: 14px; background: var(--card); box-shadow: 0 18px 50px rgba(0, 0, 0, .35); }
    h1 { margin: 0 0 8px; color: var(--primary); font-size: 26px; }
    h2 { margin: 0 0 12px; font-size: 20px; }
    p { color: var(--muted); line-height: 1.5; }
    label { display: block; margin: 24px 0 8px; font-size: 14px; font-weight: 700; }
    input { width: 100%; padding: 13px 14px; border: 1px solid #52525b; border-radius: 8px; background: #18181b; color: #fff; font-size: 16px; }
    input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
    button { width: 100%; margin-top: 22px; padding: 13px 16px; border: 0; border-radius: 8px; background: var(--primary); color: #000; font-size: 15px; font-weight: 700; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    .message { margin: 16px 0 0; font-size: 14px; }
    .error { color: #fca5a5; }
    .success { color: #86efac; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>H&amp;S Car</h1>
    <section id="reset-form-section">
      <h2>Passwort zurücksetzen</h2>
      <p>Legen Sie ein neues Passwort für Ihr Konto fest.</p>
      <form id="reset-form" novalidate>
        <label for="new-password">Neues Passwort</label>
        <input id="new-password" name="newPassword" type="password" minlength="8" autocomplete="new-password" required>
        <button id="submit-button" type="submit">Passwort speichern</button>
      </form>
      <p id="error-message" class="message error" role="alert" hidden></p>
    </section>
    <section id="success-section" hidden>
      <h2>Passwort gespeichert</h2>
      <p class="success">Ihr Passwort wurde erfolgreich aktualisiert. Sie werden zur Anmeldung weitergeleitet.</p>
    </section>
  </main>
  <script src="./api-config.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token') || '';
    const form = document.getElementById('reset-form');
    const submitButton = document.getElementById('submit-button');
    const errorMessage = document.getElementById('error-message');
    const formSection = document.getElementById('reset-form-section');
    const successSection = document.getElementById('success-section');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorMessage.hidden = true;
      const newPassword = document.getElementById('new-password').value;
      if (!token || newPassword.length < 8) {
        errorMessage.textContent = 'Bitte geben Sie ein Passwort mit mindestens 8 Zeichen ein.';
        errorMessage.hidden = false;
        return;
      }

      submitButton.disabled = true;
      try {
        const apiBaseUrl = window.HS_CAR_API_URL || (window.location.hostname === 'localhost' ? 'http://localhost:3000' : '');
        if (!apiBaseUrl) throw new Error('Passwort-Reset ist noch nicht konfiguriert.');
        const response = await fetch(`${apiBaseUrl}/api/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
          body: new URLSearchParams({ token, newPassword })
        });
        const responseType = response.headers.get('content-type') || '';
        const result = responseType.includes('application/json')
          ? await response.json()
          : { error: 'Der Passwort-Reset-Endpoint ist auf dem Backend nicht verfügbar.' };
        if (!response.ok) throw new Error(result.error || 'Passwort konnte nicht gespeichert werden.');
        formSection.hidden = true;
        successSection.hidden = false;
        window.setTimeout(() => { window.location.href = '/index.html?auth=login'; }, 1800);
      } catch (error) {
        errorMessage.textContent = error.message;
        errorMessage.hidden = false;
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
