    <style>
        :root {

            --bg-dark: #0a0a0a;

            --card-bg: #161616;
            --text-color: #e0e0e0;
        }

        /* SIDEBAR STYLES */

            background: var(--sidebar-bg); 
            border-right: 1px solid #222;

            flex-shrink: 0;
        }

        .nav-item {

            padding: 20px 30px;

            text-decoration: none; 
            border-bottom: 1px solid #1a1a1a; 
            transition: 0.3s ease; 
        }

            color: var(--gold); 
            background: #1a1a1a; 
        }

            flex: 1; 
            padding: 60px 80px; 
            position: relative;
            max-width: 1000px;
        }

        .header-top {

            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

            background: var(--sidebar-bg);
            color: var(--gold);

            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
        }

            background: var(--sidebar-bg);
            color: #fff;
        }

        h1 {

            color: var(--gold); 
            margin-bottom: 30px; 
            font-size: 2.2rem;
        }

        .back-btn {

            color: var(--gold); 
            text-decoration: none; 
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .back-btn:hover {
            color: #fff;
        }

            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #222;
            line-height: 1.7;

            font-size: 1.15rem;

            margin-bottom: 10px;
        }

            margin-bottom: 15px;

            padding-left: 20px;

            height: 1px;
            background: #2a2a2a;

        // 2. DİL DEĞİŞTİRME FONKSİYONU
        function setLanguage(lang) {
            if (!translations[lang]) lang = 'de'; 

            document.documentElement.lang = lang;

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });

            document.getElementById('legalContent').innerHTML = translations[lang].html;

            localStorage.setItem('preferredLang', lang);
            document.getElementById('languageSelect').value = lang;
        }

        // 3. SAYFA İLİŞKİLENDİRME VE YÜKLEME
        document.addEventListener('DOMContentLoaded', () => {
            const currentFile = window.location.pathname.split("/").pop();
            document.querySelectorAll('.nav-item').forEach(link => {
                if (link.getAttribute('href') === currentFile) link.classList.add('active');
            });

            const savedLang = localStorage.getItem('preferredLang') || 'de';
            setLanguage(savedLang);

            document.getElementById('languageSelect').value = savedLang;
            document.getElementById('languageSelect').addEventListener('change', (e) => {
                setLanguage(e.target.value);
            });
        });
