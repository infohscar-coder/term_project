<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #d4af37; 
            --bg-dark: #0a0a0a; 
            --sidebar-bg: #121212; 
            --card-bg: #161616;
            --text-color: #e0e0e0;
            --border-color: #222222;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-color); 
            display: flex; 
            justify-content: center;
            min-height: 100vh; 
        }
        
        /* MAIN CONTENT AREA */
        .content { 
            flex: 1; 
            padding: 60px 80px; 
            position: relative;
            max-width: 1000px;
            width: 100%;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .lang-select {
            background: var(--sidebar-bg);
            color: var(--gold);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
        }

        .lang-select option {
            background: var(--sidebar-bg);
            color: #fff;
        }

        h1 { 
            font-family: 'Playfair Display', serif; 
            color: var(--gold); 
            margin-bottom: 30px; 
            font-size: 2.2rem;
        }

        .back-btn { 
            display: inline-block; 
            color: var(--gold); 
            text-decoration: none; 
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .back-btn:hover {
            color: #fff;
        }

        /* ACCORDION / CARD SECTION */
        .tips-container {
            background: var(--card-bg);
            padding: 25px 35px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .accordion-item {
            border-bottom: 1px solid #222222;
            padding: 20px 0;
            cursor: pointer;
        }

        .accordion-item:last-child {
            border-bottom: none;
        }

        .accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            font-weight: 600;
            font-size: 1.05rem;
            user-select: none;
        }

        .accordion-header .arrow {
            color: var(--gold);
            font-size: 0.75rem;
            transition: transform 0.3s ease;
        }

        .accordion-item.active .arrow {
            transform: rotate(180deg);
        }

        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            color: #bbb;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .accordion-item.active .accordion-body {
            max-height: 400px;
            padding-top: 15px;
        }
    </style>
</head>

    </main>

        function setLanguage(lang) {
            if (!translations[lang]) lang = 'de'; 

            document.documentElement.lang = lang;

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });

            // Render Accordion tips
            const container = document.getElementById('tipsContainer');
            container.innerHTML = '';
            
            translations[lang].tips.forEach(item => {
                const accItem = document.createElement('div');
                accItem.className = 'accordion-item';
                accItem.innerHTML = `
                    <div class="accordion-header">
                        <span>${item.q}</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="accordion-body">
                        <p>${item.a}</p>
                    </div>
                `;
                
                accItem.addEventListener('click', () => {
                    const isActive = accItem.classList.contains('active');
                    document.querySelectorAll('.accordion-item').forEach(el => el.classList.remove('active'));
                    if (!isActive) accItem.classList.add('active');
                });

                container.appendChild(accItem);
            });

            localStorage.setItem('preferredLang', lang);
            document.getElementById('languageSelect').value = lang;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('preferredLang') || 'de';
            setLanguage(savedLang);

            document.getElementById('languageSelect').addEventListener('change', (e) => {
                setLanguage(e.target.value);
            });
        });
    </script>
</body>
